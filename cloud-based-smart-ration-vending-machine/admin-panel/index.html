<!DOCTYPE html>
<html>
<head>
  <title>Smart Ration Vending Machine - Admin Panel</title>

  <!-- LOGIN PROTECTION -->
  <script>
    if (!sessionStorage.getItem("loggedIn")) {
      window.location.href = "login.html";
    }
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #6dd5fa, #2980b9);
    }

    .header {
      background: #fff;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
      margin-right: 14px;
      font-weight: 600;
      color: #222;
    }

    .profile img {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #2980b9;
    }

    .header {
      align-items: center;
    }

    .logout {
      background: #333;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
    }

    .container {
      width: 90%;
      margin: 20px auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    input {
      padding: 8px;
      width: 95%;
    }

    button {
      padding: 8px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: white;
      margin: 5px;
    }

    .btn-add { background: green; }
    .btn-update { background: #0d6efd; }
    .btn-reset { background: orange; }
    .btn-delete { background: red; }

    /* DARK BUTTONS */
    .edit-btn { background: #333; color: white; }
    .page-btn { background: #333; color: white; }

    .search-box {
      margin-top: 15px;
      width: 100%;
      padding: 8px;
    }

    table {
      width: 100%;
      margin-top: 10px;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      text-align: center;
    }

    th {
      background: #f2f2f2;
    }

    .pagination {
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="header">
  <h2>Smart Ration Vending Machine - Admin Panel</h2>
  <div class="profile">
    <img src="assets/kadambari-profile.jpeg" alt="Kadambari Pawar profile photo">
    <span>KadambariPawar1</span>
  </div>
  <button class="logout" onclick="logout()">Logout</button>
</div>

<div class="container">

  <h3>User Management</h3>

  <!-- FORM -->
  <div class="form-grid">
    <input id="rfid" placeholder="RFID Tag ID">
    <input id="ration" placeholder="Ration Card ID">
    <input id="name" placeholder="Name">
    <input id="mobile" placeholder="Mobile">
    <input id="fingerprint" placeholder="Fingerprint ID">
    <input id="wheat" placeholder="Wheat Quota">
    <input id="rice" placeholder="Rice Quota (g)">
  </div>

  <div style="text-align:center;margin-top:10px;">
    <button class="btn-add" onclick="addUser()">Add User</button>
    <button class="btn-update" onclick="updateUser()">Update User</button>
    <button class="btn-reset" onclick="resetQuota()">Reset Quota</button>
    <button class="btn-delete" onclick="deleteUser()">Delete</button>
  </div>

  <!-- SEARCH -->
  <input class="search-box" id="searchInput"
         placeholder="Search by RFID / Name / Ration ID / Mobile"
         onkeyup="searchUser()">

  <!-- TABLE -->
  <table id="userTable">
    <thead>
      <tr>
        <th>RFID</th>
        <th>Ration ID</th>
        <th>Name</th>
        <th>Mobile</th>
        <th>Fingerprint</th>
        <th>Wheat</th>
        <th>Rice</th>
        <th>Last Dispense</th>
        <th>Edit</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- PAGINATION -->
  <div class="pagination">
    <button class="page-btn" onclick="prevPage()">Previous</button>
    Page <span id="pageNum">1</span>
    <button class="page-btn" onclick="nextPage()">Next</button>
  </div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
const firebaseConfig = {
  apiKey:"API-KEY",
  databaseURL:"database-url"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let usersData = [];
let currentPage = 1;
let rowsPerPage = 5;

// LOAD USERS
db.ref("users").on("value", function(snapshot) {
  usersData = [];
  snapshot.forEach(child => {
    usersData.push({ key: child.key, ...child.val() });
  });
  displayTable();
});

// DISPLAY TABLE
function displayTable() {
  const tbody = document.querySelector("#userTable tbody");
  tbody.innerHTML = "";

  let start = (currentPage - 1) * rowsPerPage;
  let end = start + rowsPerPage;
  let pageData = usersData.slice(start, end);

  pageData.forEach(d => {
    tbody.innerHTML += `
      <tr>
        <td>${d.key}</td>
        <td>${d.ration_card_id || ""}</td>
        <td>${d.name || ""}</td>
        <td>${d.mobile || ""}</td>
        <td>${d.fingerprint_id || ""}</td>
        <td>${d.wheat_quota || ""}</td>
        <td>${d.rice_quota || ""}</td>
        <td>${d.last_dispense_time || ""}</td>
        <td><button class="edit-btn" onclick="fillForm('${d.key}')">Edit</button></td>
      </tr>
    `;
  });

  document.getElementById("pageNum").innerText = currentPage;
}

// PAGINATION
function nextPage() {
  if (currentPage * rowsPerPage < usersData.length) {
    currentPage++;
    displayTable();
  }
}
function prevPage() {
  if (currentPage > 1) {
    currentPage--;
    displayTable();
  }
}

// SEARCH
function searchUser() {
  let input = document.getElementById("searchInput").value.toLowerCase();
  let rows = document.querySelectorAll("#userTable tbody tr");
  rows.forEach(row => {
    row.style.display = row.innerText.toLowerCase().includes(input) ? "" : "none";
  });
}

// DUPLICATE CHECK (for ADD only)
function checkDuplicateForAdd(rfid, ration, mobile, fingerprint, callback) {
  db.ref("users").once("value", function(snapshot) {
    let duplicate = false;
    snapshot.forEach(child => {
      const d = child.val();
      if (
        child.key === rfid ||
        d.ration_card_id === ration ||
        d.mobile === mobile ||
        String(d.fingerprint_id) === fingerprint
      ) {
        duplicate = true;
      }
    });
    callback(duplicate);
  });
}

// ADD USER
function addUser() {
  const rfid = document.getElementById("rfid").value;
  const ration = document.getElementById("ration").value;
  const name = document.getElementById("name").value;
  const mobile = document.getElementById("mobile").value;
  const fingerprint = document.getElementById("fingerprint").value;
  const wheat = document.getElementById("wheat").value;
  const rice = document.getElementById("rice").value;

  if (!rfid || !ration || !mobile || !fingerprint) {
    alert("Fill required fields");
    return;
  }

  checkDuplicateForAdd(rfid, ration, mobile, fingerprint, function(isDuplicate) {
    if (isDuplicate) {
      alert("Duplicate RFID / Ration Card / Mobile / Fingerprint not allowed!");
      return;
    }

    db.ref("users/" + rfid).set({
      ration_card_id: ration,
      name: name,
      mobile: mobile,
      fingerprint_id: Number(fingerprint),
      wheat_quota: Number(wheat),
      rice_quota: Number(rice),
      last_dispense_time: ""
    });

    alert("User Added Successfully");
  });
}

// UPDATE USER
function updateUser() {
  const rfid = document.getElementById("rfid").value;
  if (!rfid) return alert("Enter RFID to update");

  db.ref("users/" + rfid).once("value", function(snapshot) {
    if (!snapshot.exists()) {
      alert("User does not exist. Use Add User.");
      return;
    }

    db.ref("users/" + rfid).update({
      ration_card_id: document.getElementById("ration").value,
      name: document.getElementById("name").value,
      mobile: document.getElementById("mobile").value,
      fingerprint_id: Number(document.getElementById("fingerprint").value),
      wheat_quota: Number(document.getElementById("wheat").value),
      rice_quota: Number(document.getElementById("rice").value)
    });

    alert("User Updated Successfully");
  });
}

// RESET QUOTA
function resetQuota() {
  const rfid = document.getElementById("rfid").value;
  db.ref("users/" + rfid).update({ wheat_quota: 0, rice_quota: 0 });
  alert("Quota Reset");
}

// DELETE (CONFIRM)
function deleteUser() {
  const rfid = document.getElementById("rfid").value;
  if (!rfid) return alert("Enter RFID");
  if (confirm("Are you sure you want to delete this user?")) {
    db.ref("users/" + rfid).remove();
    alert("User Deleted");
  }
}

// FILL FORM
function fillForm(rfid) {
  db.ref("users/" + rfid).once("value", function(snapshot) {
    const d = snapshot.val();
    document.getElementById("rfid").value = rfid;
    document.getElementById("ration").value = d.ration_card_id;
    document.getElementById("name").value = d.name;
    document.getElementById("mobile").value = d.mobile;
    document.getElementById("fingerprint").value = d.fingerprint_id;
    document.getElementById("wheat").value = d.wheat_quota;
    document.getElementById("rice").value = d.rice_quota;
  });
}

// LOGOUT
function logout() {
  sessionStorage.clear();
  window.location.href = "login.html";
}
</script>

</body>
</html>
